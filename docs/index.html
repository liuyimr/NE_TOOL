成，超时重发会把 DUP 标志置 1，因此可能重复投递；接收端须按 Packet Identifier 或业务幂等去重"}},{id:"qos-2",label:"QoS 2 恰好一次 四次握手",values:{item:"QoS 2 服务质量",value:"Exactly once / 四次握手（恰好一次）",note:"PUBLISH → PUBREC → PUBREL → PUBCOMP 双阶段确认，不丢不重；报文数与延迟最大，适合计费、控制指令等关键消息"}},{id:"qos-packet-id",label:"QoS 报文标识 Packet Identifier",values:{item:"QoS 1/2 报文标识",value:"Packet Identifier（2 字节，非零）",note:"QoS 1/2 的 PUBLISH 必须携带，用于 PUBACK / PUBREC / PUBREL / PUBCOMP 配对；同一会话内未完成的报文标识不可复用"}},{id:"topic-level",label:"主题层级分隔符 /",values:{item:"主题层级分隔符",value:"/",note:"如 factory/line1/plc1/temp；Topic Name 为 UTF-8 字符串、区分大小写；订阅时使用 Topic Filter 才可含通配符"}},{id:"topic-plus",label:"单层通配符 +",values:{item:"单层通配符",value:"+",note:"只匹配一个完整层级：factory/+/temp 匹配 factory/line1/temp，不匹配 factory/line1/cell2/temp；必须独占整个层级，可出现在任意层"}},{id:"topic-hash",label:"多层通配符 # 父级匹配",values:{item:"多层通配符",value:"#",note:"匹配零个或多个层级，只能出现在过滤器末尾并独占最后一层；sport/# 同时匹配父级 sport 本身；不允许写成 sport/#/ranking；订阅 # 会收到 $ 开头主题以外的全部消息"}},{id:"topic-dollar",label:"$SYS 系统主题不被通配符匹配",values:{item:"$ 前缀系统主题",value:"$SYS/...",note:"以 $ 开头的 Topic Name 不会被 # 或 + 开头的过滤器匹配（MQTT 3.1.1 §4.7.2），常用于 Broker 运行统计；需订阅 $SYS/# 显式写出前缀"}},{id:"topic-empty",label:"前导斜杠与空层级",values:{item:"空层级与命名禁忌",value:"/a、a//b 均为合法层级",note:"层级允许为空字符串，单独的 / 也是一个合法层级；前导 / 会多出无意义首层并浪费索引，属工程经验值，命名时应避免"}},{id:"retain",label:"保留消息 retain",values:{item:"保留消息",value:"RETAIN = 1",note:"Broker 为每个 Topic 保存最后一条保留消息，新订阅者连接后立即收到最新值；清除需向该 Topic 发布一条 payload 为空的保留消息"}},{id:"lwt",label:"遗嘱消息 LWT willTopic",values:{item:"遗嘱消息 LWT",value:"willTopic / willPayload / willQos / willRetain",note:"在 CONNECT 报文中声明；客户端异常断开（未发 DISCONNECT、keepalive 超时、网络中断）时由 Broker 代为发布；正常 DISCONNECT 不触发；MQTT 5 另有 Will Delay Interval"}},{id:"clean-session",label:"clean session 持久会话 3.1.1",values:{item:"Clean Session（MQTT 3.1.1）",value:"CleanSession = 1 / 0",note:"=1 每次新建会话、断开即清除订阅与未完成的 QoS 1/2 报文；=0 使用持久会话，重连后恢复订阅与排队消息"}},{id:"session-expiry",label:"Session Expiry Interval MQTT 5",values:{item:"会话过期间隔（MQTT 5.0）",value:"0 / 1~4294967295 s",note:"单位秒；0 = 连接断开即失效，4294967295(0xFFFFFFFF) = 永不过期；MQTT 5 用它替代并细化 3.1.1 的持久会话机制"}},{id:"keepalive",label:"keepalive 默认 60 s",values:{item:"保活间隔 Keep Alive",value:"默认 60 s（常见 30~120 s）",note:"CONNECT 报文字段，单位秒；客户端须在该间隔内发送任意报文，空闲则发 PINGREQ。工程经验值，按链路质量与 NAT/负载均衡空闲超时设定，以设计说明/厂家样本为准"}},{id:"keepalive-15",label:"1.5 倍 keepalive 超时断开",values:{item:"服务端超时判定",value:"1.5 × Keep Alive",note:"服务端在 1.5 倍保活时间内未收到任何报文即断开连接（MQTT 3.1.1 §3.1.2.10）；客户端重连退避与告警阈值为工程经验值"}},{id:"ping",label:"心跳 PINGREQ PINGRESP",values:{item:"心跳报文",value:"PINGREQ / PINGRESP",note:"固定头 2 字节、无 payload、无 QoS；客户端空闲时发 PINGREQ，服务端回 PINGRESP；同时用于维持 NAT 与防火墙会话表项"}},{id:"port-1883",label:"端口 1883 MQTT TCP",values:{item:"明文 TCP 端口",value:"1883",note:"IANA 注册服务名 mqtt，MQTT over TCP；适用于内网与测试环境，公网应配合 TLS 与认证"}},{id:"port-8883",label:"端口 8883 MQTT TLS",values:{item:"TLS 加密端口",value:"8883",note:"IANA 注册服务名 secure-mqtt，MQTT over TLS；双向认证(mTLS) 需配客户端证书，注意 SNI 与证书主题校验"}},{id:"port-websocket",label:"端口 8083 8084 WebSocket",values:{item:"WebSocket 端口",value:"8083 (ws) / 8084 (wss)",note:"浏览器需走 ws/wss；8083/8084 为 EMQX、Mosquitto 等 Broker 常见默认监听端口，非 IANA 固定值，属工程经验值，以所用 Broker 配置与厂家样本为准"}},{id:"client-id",label:"ClientId 唯一性 互踢",values:{item:"客户端标识唯一性",value:"同一 Broker 内 ClientId 唯一",note:"MQTT 3.1.1 中重复 ClientId 会使服务端断开先前连接（互踢），造成两台设备反复掉线；MQTT 5 允许留空由服务端分配。建议用 设备编号_随机后缀"}},{id:"topic-naming",label:"Topic 命名建议 前导斜杠 空格",values:{item:"Topic 命名规范",value:"小写 + 下划线、层级固定",note:"避免前导 /、空格、非 ASCII 字符，不用 # + $ 作普通层；推荐 <租户>/<区域>/<设备类型>/<设备id>/<测点>，便于分层授权与订阅。工程经验值，以设计说明为准"}},{id:"msg-size",label:"单条消息大小 256 MB 上限",values:{item:"单条消息长度",value:"协议上限 268435455 B ≈ 256 MB",note:"由 4 字节变长 Remaining Length 决定；现场遥测建议 payload ≤ 1~16 KB，MQTT 5 可用 Maximum Packet Size 协商上限。工程经验值，以 Broker 配置与厂家样本为准"}},{id:"payload-json",label:"payload JSON ts deviceId",values:{item:"payload 组织建议",value:"JSON + ts + deviceId",note:"带毫秒时间戳与设备唯一标识，便于去重、排序与溯源；高频或窄带链路可用二进制/压缩编码。工程经验值，以设计说明与厂家样本为准"}}],S1=!0,x1="OASIS MQTT 3.1.1（OASIS Standard, 2014）与 OASIS MQTT 5.0（OASIS Standard, 20 "加载前须确认水流开关闭合、电动阀到位反馈；死区与延时为工程经验值，以设计说明与厂家调试手册为准"}},{id:"chiller-rotate",label:"冷冻站 运行小时数轮换",values:{system:"冷冻站",strategy:"机组轮换（先启先停 / 均衡磨损）",trigger:"启停时刻或每周定时轮换",action:"优先启动累计运行小时数最少的机组，优先停止累计运行小时数最多的机组",interlock:"轮换时不得同时启停两台；备用机组故障应自动跳过并报警；工程经验值，以设计说明为准"}},{id:"chiller-start-seq",label:"冷冻站 启停顺序 停机反序",values:{system:"冷冻站",strategy:"启停顺序与步间延时",trigger:"收到开机/停机命令且无故障与防冻报警",action:"开机：冷却塔风机 → 冷却水泵 → 冷冻水泵 → 冷水机组；停机严格反序：先停冷水机组，延时后再停水泵与冷却塔",interlock:"每步延时 10~30 s 等待设备运行反馈与水流建立；任一水流开关未闭合即中止后续启动并报警；延时为工程经验值"}},{id:"chiller-min-run",label:"冷冻站 最小运行时间 防频繁启停",values:{system:"冷冻站",strategy:"最小运行 / 最小停机时间",trigger:"机组刚启动或刚停止",action:"在最小运行时间内禁止停机、在最小停机时间内禁止再启动，屏蔽负荷加减载请求",interlock:"常见 15~30 min，保护压缩机与润滑油系统；工程经验值，以冷水机组厂家样本与调试手册为准"}},{id:"chiller-flow-switch",label:"冷冻站 水流开关联锁",values:{system:"冷冻站",strategy:"水流保护联锁",trigger:"水泵启动后水流开关未闭合，或运行中水流开关断开",action:"禁止启动冷水机组；运行中立即停机并发出紧急报警",interlock:"蒸发器与冷凝器均需断水保护；水流开关装在出水管直管段、桨片不得碰管壁；属工程经验做法，以设计说明为准"}},{id:"chiller-dp-bypass",label:"冷冻站 压差旁通阀",values:{system:"冷冻站",strategy:"供回水压差旁通调节",trigger:"末端二通阀关小导致供回水压差高于设定值",action:"PID 调节旁通阀开度，维持设定压差并保障机组最小流量",interlock:"设定压差常取 0.10~0.15 MPa（1.0~1.5 bar）；须与机组最小允许流量校核；工程经验值，以设计说明与水力计算书为准"}},{id:"chiller-chw-reset",label:"冷冻站 冷冻水供水温度重设",values:{system:"冷冻站",strategy:"冷冻水供水温度重设（CHWS Reset）",trigger:"室外温度降低或系统处于部分负荷（如负荷率 < 60%）",action:"将供水温度设定值由 7 ℃ 逐步上抬至 10~12 ℃",interlock:"可提升机组 COP，但须校核末端除湿与除湿再热需求；湿度优先场所需限制重设上限；工程经验值，以设计说明为准"}},{id:"ahu-temp-pid",label:"AHU 回风温度 PID 冷热水阀",values:{system:"空调箱 AHU",strategy:"回风温度 PID 调节",trigger:"回风温度偏离设定值（夏季常取 24±1 ℃，冬季 20~22 ℃）",action:"PID 调节冷水阀 / 热水阀开度，夏季制冷、冬季加热，带死区与输出限幅",interlock:"风机未运行或防冻报警时强制关冷阀；水阀与风机状态、风阀到位反馈联锁；整定参数为工程经验值，以调试手册为准"}},{id:"ahu-sat-reset",label:"AHU 送风温度重设",values:{system:"空调箱 AHU",strategy:"送风温度设定值重设",trigger:"各 VAV 末端阀位或区域负荷反馈（最大阀位偏离目标区间）",action:"按最不利末端需求重设送风温度设定（常见 13~18 ℃）",interlock:"避免过冷后再热；重设速率需限幅防止振荡；工程经验值，以设计说明与厂家调试手册为准"}},{id:"ahu-enthalpy",label:"AHU 新风焓值比较 经济运行",values:{system:"空调箱 AHU",strategy:"焓值比较与经济运行（免费供冷）",trigger:"室外空气焓值 < 回风焓值，且室外干球温度在可用区间内",action:"开大新风阀、关小回风阀、关小冷水阀，尽量用室外新风承担冷负荷",interlock:"需室外温湿度与回风温湿度传感器；雨雪、雾霾、极端低温或高湿时退出经济运行并锁定最小新风；工程经验值，以设计说明为准"}},{id:"ahu-co2",label:"AHU CO2 浓度联动新风阀",values:{system:"空调箱 AHU",strategy:"CO₂ 需求控制通风（DCV）",trigger:"回风 CO₂ 浓度高于设定值（常取 800~1000 ppm）",action:"增大新风阀最小开度；浓度回落后逐步恢复",interlock:"新风阀仍须满足人员最小新风量下限；CO₂ 传感器需自动基线校准（ABC）；设定值为工程经验值，以设计说明为准"}},{id:"ahu-freeze",label:"AHU 防冻保护 盘管后温度低限",values:{system:"空调箱 AHU",strategy:"防冻保护（最高优先级）",trigger:"盘管后温度低于低限（常取 5 ℃）或低温断路防冻开关动作",action:"关闭新风阀、全开热水阀、停止送风机、发出紧急报警并锁定",interlock:"优先级高于温控与时间表；须采用独立防冻开关（硬接线），故障排除后人工手动复位；低限值为工程经验值，以设计说明与厂家样本为准"}},{id:"ahu-interlock",label:"AHU 风机 风阀 水阀联锁",values:{system:"空调箱 AHU",strategy:"设备启停联锁顺序",trigger:"开机 / 停机命令",action:"开机：先开新风阀与回风阀 → 确认到位 → 启送风机 → 允许调节水阀；停机反序并关闭新风阀",interlock:"风机压差开关确认运转后方可开水阀；防火阀熔断（70 ℃）必须连锁停风机；属工程经验做法，以设计说明为准"}},{id:"ahu-filter",label:"AHU 滤网压差报警",values:{system:"空调箱 AHU",strategy:"滤网堵塞压差监测",trigger:"滤网前后压差超过设定报警值",action:"报滤网堵塞/清洗提示并记录时间，必要时限制风机频率",interlock:"初效常取 50~100 Pa、中效 100~200 Pa；取压点应避开涡流、软管防积水；设定值为工程经验值，以厂家样本为准"}},{id:"fau-sat",label:"新风机组 送风温度控制",values:{system:"新风机组 FAU",strategy:"送风温度 PID 控制",trigger:"送风温度偏离设定值（冬季常取 18~20 ℃）",action:"PID 调节冷/热盘管水阀开度，全新风工况按送风温度而非回风温度控制",interlock:"与预热阀、防冻保护串联；风机停机时关闭水阀与新风阀；整定值为工程经验值，以调试手册为准"}},{id:"fau-schedule",label:"新风机组 定时启停 节假日",values:{system:"新风机组 FAU",strategy:"时间表定时启停",trigger:"到达工作日 / 节假日时间表时段",action:"按占用时段启停，可设提前预热/预冷时间（如提前 15~30 min）",interlock:"与节假日日历、临时加班申请联动；停机后关闭新风阀防冻；工程经验值，以设计说明为准"}},{id:"fau-preheat",label:"新风机组 冬季预热",values:{system:"新风机组 FAU",strategy:"冬季预热盘管联锁",trigger:"室外温度低于低限（常取 5 ℃）或盘管后温度接近防冻限",action:"先开预热阀并延时，待盘管后温度回升后再启动送风机",interlock:"与防冻保护串联，预热阀失效不得强行开机；低限与延时为工程经验值，以设计说明与厂家样本为准"}},{id:"vav-static-reset",label:"VAV 静压重设",values:{system:"VAV 变风量系统",strategy:"送风机静压设定重设",trigger:"各 VAV 末端风阀阀位反馈（最不利阀位长期偏小）",action:"按最不利阀位接近全开（如 80%~90%）的目标重设静压设定，变频降转速",interlock:"显著降低风机能耗；重设上下限与速率需限幅并保证最不利末端风量；工程经验值，以调试手册为准"}},{id:"vav-min-flow",label:"VAV 最小风量",values:{system:"VAV 变风量系统",strategy:"末端最小风量限制",trigger:"室内负荷降低、末端需求风量小于下限",action:"保持最小风量设定，防止新风不足与气流组织恶化",interlock:"常取设计风量的 30%~50%；须按人员最小新风量校核，再热型末端还需校核再热控制；工程经验值，以设计说明为准"}},{id:"common-schedule",label:"通用 时间表 节假日 占用模式",values:{system:"通用",strategy:"时间表 / 节假日 / 占用模式",trigger:"到达日程时段或节假日日历命中",action:"切换占用与非占用模式的温度设定、新风量与设备启停",interlock:"支持例外日、临时强制与远程接管；时间同步（NTP）异常应告警；工程经验值，以设计说明为准"}},{id:"common-alarm",label:"通用 报警分级",values:{system:"通用",strategy:"报警分级与记录",trigger:"设备故障、参数越限、通信中断",action:"按紧急 / 重要 / 一般分级推送，记录发生时间、确认人与恢复时间",interlock:"紧急报警（防冻、水流、防火阀）须直接联动停机；报警阈值与延时防抖为工程经验值，以设计说明为准"}},{id:"common-bumpless",label:"通用 手动自动 无扰动切换",values:{system:"通用",strategy:"手动 / 自动无扰动切换",trigger:"操作员在 HMI 上切换手自动或就地/远程",action:"切换瞬间保持当前输出值（阀位、频率、启停状态），之后按新模式渐变到目标值",interlock:"避免阀门与风机输出跳变（bumpless transfer）；自动模式下手动强制需有超时自动释放；工程经验值，以调试手册为准"}}],zv=!0,Vv="楼宇自控（BA）工程调试实践整理；本表所有策略、整定值与延时均为工程经验值，以设计说明、控制原理图、点表与厂家调试手册为准，不作为规范强制条文，亦不引用具体规范条文号",Wv="2026-11-05",Uv={id:Ov,title:Lv,domain:jv,columns:$v,rows:Fv,searchable:zv,source:Vv,updatedAt:Wv},Kv="building.sensorSelection",Hv="传感器量程与精度选型",Gv="building",qv=[{key:"point",label:"测点",align:"left"},{key:"range",label:"推荐量程",align:"left"},{key:"accuracy",label:"推荐精度",align:"left"},{key:"signal",label:"输出信号",align:"left"},{key:"install",label:"安装位置与注意",align:"left"}],Qv=[{id:"indoor-temp",label:"室内温度 房间温度传感器",values:{point:"室内温度",range:"0~50 ℃（或 −10~50 ℃）",accuracy:"±0.3~0.5 ℃",signal:"PT1000 / NTC 10k 电阻，或 0-10 V、4-20 mA 变送",install:"离地 1.2~1.5 m 墙面，避开送风口直吹、阳光直射、外墙冷辐射与门边；不与温控器热源同盒"}},{id:"outdoor-temp",label:"室外温度 焓值经济运行",values:{point:"室外温度",range:"−40~+60 ℃",accuracy:"±0.5 ℃",signal:"PT1000 或 4-20 mA / 0-10 V 变送",install:"装在北向通风百叶箱内、遮阳防雨，远离排风口、冷却塔与屋面热辐射；引线需屏蔽"}},{id:"duct-temp",label:"风管送风 回风温度",values:{point:"风管送/回风温度",range:"0~50 ℃（送风常用 0~40 ℃）",accuracy:"±0.3~0.5 ℃",signal:"PT1000 / NTC，或 0-10 V、4-20 mA 变送",install:"探头插入风管中心气流稳定段，插入深度 ≥ 管径 1/3~1/2，迎/逆气流按厂家要求；穿管处密封防漏风，避开表冷器直接辐射"}},{id:"pipe-temp",label:"水管供水 回水温度",values:{point:"水管供/回水温度",range:"冷冻水 0~50 ℃；热水 0~100 ℃（可选 0~120 ℃）",accuracy:"±0.3~0.5 ℃",signal:"PT1000 或 4-20 mA 变送",install:"必须配温度计套管（不锈钢），插入深度 ≥ 管径 1/2 且越过管中心，宜逆流 45° 斜插；套管内填导热硅脂，避免装在阀门/弯头湍流区"}},{id:"humidity",label:"相对湿度 房间 风管",values:{point:"相对湿度",range:"0~100 %RH",accuracy:"±3~5 %RH（20~80 %RH @ 25 ℃）",signal:"0-10 V / 4-20 mA / Modbus RTU",install:"避开风口直吹、结露与蒸汽；风管型需带防结露探头；高分子电容式年漂移约 1~3 %RH，建议每年校准"}},{id:"co2",label:"CO2 浓度 新风需求控制",values:{point:"CO₂ 浓度",range:"0~2000 ppm（人员密集场所可选 0~5000 ppm）",accuracy:"±(50 ppm + 3% 读数)",signal:"0-10 V / 4-20 mA / Modbus RTU / BACnet",install:"NDIR 原理；装于回风管或人员区 1.2~1.8 m，避开新风直吹与门口；开启自动基线校准(ABC)需保证定期有新鲜空气；定期单点校验"}},{id:"room-dp",label:"房间压差 洁净 负压",values:{point:"房间 / 区域压差",range:"−50~+50 Pa（洁净室常用 ±30 Pa 或 0~60 Pa）",accuracy:"±1~2 Pa 或 ±1% FS",signal:"0-10 V / 4-20 mA 微差压变送器",install:"两侧取压管等长同径、避免气流直冲与温度差，室内侧加阻尼；零点随季节漂移需定期校准，取压口远离门缝与送风口"}},{id:"filter-dp",label:"滤网压差 风管压差",values:{point:"风管 / 滤网压差",range:"0~500 Pa（滤网差压常用 0~250 Pa）",accuracy:"±1~2% FS",signal:"0-10 V / 4-20 mA，或差压开关干接点",install:"高/低压取压点分设滤网前后直管段；引压软管不得积水、应坡向取压点；报警值按初阻力 2~3 倍设定（工程经验值）"}},{id:"water-pressure",label:"水管压力 供回水压差",values:{point:"水管压力 / 压差",range:"0~1.0 MPa 或 0~1.6 MPa（按系统工作压力 1.5 倍选）",accuracy:"±0.5~1% FS",signal:"4-20 mA（两线制）或 0-10 V",install:"取压点设在直管段（前 ≥5D、后 ≥2D），加缓冲弯管/阻尼防泵启停水锤；配检修阀与针阀，传感器避免装在最高点气塞处"}},{id:"water-flow",label:"水流量 电磁流量计",values:{point:"水流量（冷冻水 / 冷却水）",range:"按管径与 0.5~3 m/s 流速确定（DN100 约 14~85 m³/h）",accuracy:"±1~2% 读数（电磁式）",signal:"4-20 mA / 脉冲 / Modbus RTU",install:"必须满管，前后直管段 ≥5D / 2D，装接地环并可靠接地；避免装在泵出口、最高点或 downward 自由出流管段；介质电导率需满足厂家要求"}},{id:"flow-switch",label:"水流开关 流量开关 桨片式",values:{point:"水流开关（流量开关）",range:"动作流量按管径现场整定（DN100 常取 8~20 m³/h 可调）",accuracy:"开关量，重复性约 ±10~20% 设定值",signal:"无源干接点 → DDC DI",install:"桨片长度按管径选、不得碰管壁或焊缝；装在水平直管段，前后 ≥5D，箭头方向与水流一致；禁止装在阀门后立即湍流区；需与水泵反馈做延时防抖"}},{id:"level",label:"液位 水箱 水池",values:{point:"液位（水箱 / 集水坑）",range:"0~2 m / 0~5 m（按容器高度选，留 10% 余量）",accuracy:"±0.5~1% FS（静压投入式）；超声波 ±0.25~0.5% FS",signal:"4-20 mA，或高/低液位开关干接点",install:"静压式探头装底部但避开进水冲击与沉积物，加阻尼筒或防浪涌管；超声波需避开液面泡沫与波束内障碍物、留盲区；高低液位开关宜独立设置作安全联锁"}},{id:"outdoor-enthalpy",label:"室外焓值 温湿度组合",values:{point:"室外焓值（由温湿度计算）",range:"由 −40~60 ℃、0~100 %RH 组合计算（约 −40~120 kJ/kg 干空气）",accuracy:"取决于温度 ±0.5 ℃ 与湿度 ±3~5 %RH 的合成误差",signal:"温湿度一体变送器 0-10 V / 4-20 mA / Modbus / BACnet",install:"与室外温湿度传感器同址装在百叶箱内；计算需代入当地大气压；用于焓值经济运行比较时与回风焓值采用同一算法与单位"}},{id:"illuminance",label:"照度 室内 室外",values:{point:"照度（照明控制 / 遮阳联动）",range:"室内 0~2000 lx；室外 0~100 klx",accuracy:"±3~5% 读数",signal:"0-10 V / 4-20 mA / Modbus RTU",install:"感光面水平安装、与被测面同高度，避开灯具直射眩光、结构遮挡与阴影；室外加防尘罩并定期清洁镜片"}},{id:"pm25",label:"PM2.5 空气质量 可选",values:{point:"PM2.5 / 空气质量（可选测点）",range:"0~500 µg/m³（或 0~1000 µg/m³）",accuracy:"±10~15% 读数（激光散射法）",signal:"Modbus RTU / 0-10 V / BACnet",install:"装在回风管或人员区，避开高湿结露、油烟与风口直吹；激光光路需定期清洁；仅用于通风联动与舒适度监测，不作计量溯源（工程经验值）"}}],Xv=!0,Jv="楼宇自控常用传感器选型的工程经验值（量程、精度、信号、安装要求）；铂电阻精度参考 IEC 60751，CO₂ 为常见 NDIR 产品样本指标，电磁流量计/微差压变送器指标取自厂商样本。以上均为选型推荐值而非规范强制值，具体以设计说明、点表与厂家样本为准；本表偏楼控选型，与工控信号形式速查 automation.sensors 侧重点不同",Yv="2026-11-05",Zv={id:Kv,title:Hv,domain:Gv,columns:qv,rows:Qv,searchable:Xv,source:Jv,updatedAt:Yv},eb="building.bacnetRef",tb="BACnet 对象与服务速查",nb="building",rb=[{key:"item",label:"标识 / 名称",align:"left",mono:!0},{key:"kind",label:"类别",align:"left"},{key:"purpose",label:"用途",align:"left"},{key:"detail",label:"典型属性 / 关键参数",align:"left"}],lb=[{id:"obj-ai",label:"AI Analog Input 模拟输入",values:{item:"AI (Analog Input)",kind:"对象类型",purpose:"模拟量输入实测值：温度、压力、湿度、流量",detail:"Present_Value（只读）、Units、Reliability、Status_Flags、Out_Of_Service、Min_Pres_Value / Max_Pres_Value、COV_Increment"}},{id:"obj-ao",label:"AO Analog Output 模拟输出",values:{item:"AO (Analog Output)",kind:"对象类型",purpose:"模拟量输出给定：水阀开度、变频器频率设定",detail:"Present_Value（可写）、Priority_Array(16 级)、Relinquish_Default、Units、Min_Pres_Value / Max_Pres_Value"}},{id:"obj-av",label:"AV Analog Value 模拟值",values:{item:"AV (Analog Value)",kind:"对象类型",purpose:"模拟量虚拟点：设定值、计算值、累计量",detail:"Present_Value、Units、Priority_Array、Relinquish_Default；常用于温度设定值与能耗累计"}},{id:"obj-bi",label:"BI Binary Input 开关输入",values:{item:"BI (Binary Input)",kind:"对象类型",purpose:"开关量输入：设备运行/故障状态、限位、水流开关",detail:"Present_Value（INACTIVE / ACTIVE）、Polarity、Status_Flags、Change_Of_State_Count、Elapsed_Active_Time"}},{id:"obj-bo",label:"BO Binary Output 开关输出",values:{item:"BO (Binary Output)",kind:"对象类型",purpose:"开关量输出：设备启停命令、电磁阀",detail:"Present_Value、Priority_Array、Relinquish_Default、Polarity、Minimum_On_Time / Minimum_Off_Time"}},{id:"obj-bv",label:"BV Binary Value 开关值",values:{item:"BV (Binary Value)",kind:"对象类型",purpose:"开关量虚拟点：手自动标志、允许运行、模式使能",detail:"Present_Value、Priority_Array、Relinquish_Default、Status_Flags"}},{id:"obj-msi",label:"MSI Multi-state Input 多状态输入",values:{item:"MSI (Multi-state Input)",kind:"对象类型",purpose:"多状态输入：风机档位反馈、阀门开/关/故障三态",detail:"Present_Value（1..N）、Number_Of_States、State_Text、Status_Flags、Reliability"}},{id:"obj-mso",label:"MSO Multi-state Output 多状态输出",values:{item:"MSO (Multi-state Output)",kind:"对象类型",purpose:"多状态输出：风机高/中/低速命令、模式切换",detail:"Present_Value、Number_Of_States、State_Text、Priority_Array、Relinquish_Default"}},{id:"obj-msv",label:"MSV Multi-state Value 多状态值",values:{item:"MSV (Multi-state Value)",kind:"对象类型",purpose:"多状态虚拟点：运行模式（占用/非占用/值班/防冻）",detail:"Present_Value、Number_Of_States、State_Text、Priority_Array、Status_Flags"}},{id:"obj-device",label:"Device 设备对象",values:{item:"Device",kind:"对象类型",purpose:"每个 BACnet 设备有且仅有一个 Device 对象，代表设备本身",detail:"Object_Identifier、Object_Name、Vendor_Identifier、Vendor_Name、Model_Name、Firmware_Revision、Protocol_Version、Max_APDU_Length_Accepted、Object_List、Database_Revision"}},{id:"obj-schedule",label:"Schedule 时间表对象",values:{item:"Schedule",kind:"对象类型",purpose:"按周计划与例外日输出设定值（温度设定、启停）",detail:"Present_Value、Weekly_Schedule、Exception_Schedule、Schedule_Default、Effective_Period、List_Of_Object_Property_References、Priority_For_Writing"}},{id:"obj-calendar",label:"Calendar 日历对象",values:{item:"Calendar",kind:"对象类型",purpose:"定义节假日 / 特殊日期集合，供 Schedule 引用",detail:"Present_Value、Date_List（日期、通配符日期范围）；与 Schedule 的 Exception_Schedule 配合使用"}},{id:"obj-trend",label:"Trend Log 趋势记录对象",values:{item:"Trend Log",kind:"对象类型",purpose:"按周期或 COV 记录历史数据，供能耗与故障追溯",detail:"Log_Enable、Logging_Type（Polled / COV / Triggered）、Log_Interval、COV_Increment、Buffer_Size、Record_Count、Stop_When_Full、Start_Time / Stop_Time"}},{id:"obj-notification",label:"Notification Class 报警通知类",values:{item:"Notification Class",kind:"对象类型",purpose:"定义报警优先级、接收者与确认要求",detail:"Priority（0~255）、Ack_Required、Recipient_List（含 To_Off_Normal / To_Fault / To_Normal 转换与有效时段）"}},{id:"obj-file",label:"File 文件对象",values:{item:"File",kind:"对象类型",purpose:"存放配置文件、日志、固件等数据流",detail:"File_Type、File_Size、Modification_Date、Archive、Read_Only、File_Access_Method；用 AtomicReadFile / AtomicWriteFile 服务分段读写"}},{id:"prop-objid",label:"Object_Identifier 对象标识",values:{item:"Object_Identifier",kind:"常用属性",purpose:"对象在全网内的唯一标识",detail:"32 位 = 对象类型编码(10 bit) + 实例号(22 bit)；设备实例号范围 0~4194302，4194303 为广播保留；同一 internetwork 内必须唯一"}},{id:"prop-objname",label:"Object_Name 对象名称",values:{item:"Object_Name",kind:"常用属性",purpose:"可读的对象名称，便于上位机与组态识别",detail:"字符串；建议包含点位编号、楼层与中文描述，且命名规则全网统一（工程经验值，以设计说明为准）"}},{id:"prop-pv",label:"Present_Value 当前值",values:{item:"Present_Value",kind:"常用属性",purpose:"对象的当前值，是读写最频繁的属性",detail:"输入对象为实测值；输出/值对象写入时经 Priority_Array 仲裁，未指定优先级时按默认级写入"}},{id:"prop-status",label:"Status_Flags 状态标志",values:{item:"Status_Flags",kind:"常用属性",purpose:"快速判断点位可信度",detail:"4 个位标志：IN_ALARM、FAULT、OVERRIDDEN、OUT_OF_SERVICE；上位机应据 FAULT 标志屏蔽该值并报警"}},{id:"prop-units",label:"Units 工程单位",values:{item:"Units",kind:"常用属性",purpose:"声明 Present_Value 的工程单位，避免量纲误读",detail:"取 BACnet EngineeringUnits 枚举名，如 degreesCelsius、percent、pascals、cubicMetersPerSecond、degreesFahrenheit；须与设备支持的枚举一致，以厂家协议实现说明(PICS)为准"}},{id:"prop-oos",label:"Out_Of_Service 退出服务",values:{item:"Out_Of_Service",kind:"常用属性",purpose:"调试时人工置值 / 仿真，脱离现场物理 I/O",detail:"为 TRUE 时 Present_Value 可由操作员写入且不反映真实物理状态；调试结束必须置回 FALSE 并复核，属工程经验做法"}},{id:"prop-priority",label:"Priority_Array 16 级优先权",values:{item:"Priority_Array",kind:"常用属性",purpose:"多来源写同一输出时的仲裁机制",detail:"1~16 级，1 级最高为 Manual Life Safety（手动生命安全），2 为自动生命安全，5 为关键设备控制，8 为手动操作员，16 最低；某一级为 NULL 表示放弃(relinquish)，由次高级生效"}},{id:"prop-relinquish",label:"Relinquish_Default 放弃默认值",values:{item:"Relinquish_Default",kind:"常用属性",purpose:"全部 16 级均放弃后的回退值",detail:"与 Priority_Array 配合实现无扰动释放；合理设置可避免时间表/手动命令释放后阀门跳到 0% 或 100%（工程经验值）"}},{id:"svc-rp",label:"ReadProperty 读属性",values:{item:"ReadProperty",kind:"服务",purpose:"读取单个对象的单个属性，最基础最常用的服务",detail:"请求含 Object_Identifier + Property_Identifier（可带 Array Index）；失败返回 Error Class / Code；轮询点数多时报文开销大"}},{id:"svc-wp",label:"WriteProperty 写属性",values:{item:"WriteProperty",kind:"服务",purpose:"写入单个对象的单个属性（设定值、手自动、启停）",detail:"可携带 Priority 参数指定写入优先级；省略时按设备默认级；写 Present_Value 后应读回确认，长期占用高级优先级会阻塞其他来源"}},{id:"svc-rpm",label:"ReadPropertyMultiple 批量读",values:{item:"ReadPropertyMultiple",kind:"服务",purpose:"一次请求读取多个对象的多个属性",detail:"显著减少轮询报文数与网络负载；需设备在其 PICS 中声明支持，否则返回 Error；工程上用于批量采集点表"}},{id:"svc-wpm",label:"WritePropertyMultiple 批量写",values:{item:"WritePropertyMultiple",kind:"服务",purpose:"一次请求写入多个对象的多个属性",detail:"批量下发设定值 / 模式切换；部分控制器不支持或限制单次 APDU 长度，需分批并检查结果列表"}},{id:"svc-subscribecov",label:"SubscribeCOV 订阅变化",values:{item:"SubscribeCOV",kind:"服务",purpose:"订阅点位值变化上报，替代高频轮询",detail:"参数含 Subscriber Process Identifier、Monitored Object Identifier、Issue Confirmed Notifications、Lifetime（秒）；Lifetime 到期前须续订，否则订阅自动失效"}},{id:"svc-covnotif",label:"ConfirmedCOVNotification COV 通知",values:{item:"ConfirmedCOVNotification",kind:"服务",purpose:"服务端在值变化超过阈值时主动推送（需确认）",detail:"含变化后的 Present_Value、Status_Flags 与时间戳；不确认版本为 UnconfirmedCOVNotification；变化阈值由对象 COV_Increment 决定"}},{id:"svc-who-is",label:"Who-Is 设备发现",values:{item:"Who-Is",kind:"服务",purpose:"广播查询网络中的 BACnet 设备",detail:"可携带 deviceInstanceRange（低/高实例号）限定范围，避免大网广播风暴；收到者以 I-Am 应答"}},{id:"svc-i-am",label:"I-Am 设备自报",values:{item:"I-Am",kind:"服务",purpose:"设备宣告自身身份与能力",detail:"含 Device Object_Identifier、Max_APDU_Length_Accepted、Segmentation_Supported、Vendor_ID；通常对 Who-Is 广播应答，也可上电主动广播"}},{id:"svc-who-has",label:"Who-Has 按对象查找",values:{item:"Who-Has",kind:"服务",purpose:"按对象名称或对象标识查找持有该对象的设备",detail:"可用 object-name 或 object-identifier 限定；持有者以 I-Have 应答；跨网段需 BBMD 转发广播"}},{id:"svc-i-have",label:"I-Have 对象归属应答",values:{item:"I-Have",kind:"服务",purpose:"告知某对象位于本设备",detail:"含 deviceIdentifier、objectIdentifier、objectName；用于对象名到设备地址的解析"}},{id:"svc-dcc",label:"DeviceCommunicationControl 通信控制",values:{item:"DeviceCommunicationControl",kind:"服务",purpose:"调试 / 维护时临时禁止设备发起 APDU",detail:"参数含 timeDuration（分钟，0=无限）与 enable-disable；务必设置有限超时，否则误用会造成设备永久失联，需本机 DIP/拨码或 ReinitializeDevice 恢复"}},{id:"svc-reinit",label:"ReinitializeDevice 远程复位",values:{item:"ReinitializeDevice",kind:"服务",purpose:"远程冷/热启动设备",detail:"需 password 与 state（coldstart / warmstart / startbackup / endbackup 等）；风险高，现场应限定权限并记录操作日志（工程经验值）"}},{id:"net-bacnet-ip",label:"BACnet/IP UDP 47808 BAC0",values:{item:"UDP 47808 (0xBAC0)",kind:"网络",purpose:"BACnet/IP 默认端口，BVLL 报文承载在 UDP 上",detail:"0xBAC0 = 47808；防火墙需放行 UDP 47808 双向；可自定义端口但同一互联网络内必须一致（工程经验值，以设计说明为准）"}},{id:"net-bbmd",label:"BBMD 跨网段广播 BDT",values:{item:"BBMD / BDT",kind:"网络",purpose:"BBMD 转发 Who-Is / I-Am 等广播，实现跨 IP 子网设备发现",detail:"每个 IP 子网部署一个 BBMD，并在广播分发表(BDT)中登记所有 BBMD 的 IP；跨 VLAN / 路由器时必配，否则只能发现本网段设备；FD 注册为外部设备用"}},{id:"net-mstp-baud",label:"MS/TP 波特率 9600 19200 38400 76800",values:{item:"MS/TP 9600 / 19200 / 38400 / 76800 bps",kind:"网络",purpose:"RS-485 主从令牌传递总线的通信速率",detail:"同一网段所有设备波特率、校验位必须完全一致；现场常用 38400 bps；速率越高允许距离越短，终端需 120 Ω 匹配电阻。工程经验值，以设计说明与厂家样本为准"}},{id:"net-instance",label:"设备实例号唯一",values:{item:"Device Instance 唯一性",kind:"网络",purpose:"Device 对象的实例号，是全网路由与发现的关键",detail:"范围 0~4194302，同一 BACnet internetwork（含跨 BBMD 的所有网段）内必须唯一；建议按楼栋/楼层/系统分段规划并建档，避免现场重复（工程经验值）"}},{id:"net-cov",label:"COV 增量与订阅生命周期",values:{item:"COV_Increment + Lifetime",kind:"网络",purpose:"控制变化上报阈值与订阅有效期",detail:"仅当变化量超过 COV_Increment 才发通知，可抑制模拟量抖动；SubscribeCOV 的 Lifetime（秒）到期未续订则订阅失效，需在到期前重订阅；阈值与续订周期为工程经验值"}},{id:"net-mstp-addr",label:"MS/TP M EC 定时器 TON / TOF / TP / TONR，以背景 DB 实例形式存在，不再使用 T 编号"}},{id:"area-c",label:"C 计数器",values:{item:"C 计数器区",format:"C0 / C1（S7-300/400）",detail:"SIMATIC 计数器（S/CU/CD），计数值 0~999，BCD 存储",note:"S7-1200/1500 改用 IEC 计数器 CTU / CTD / CTUD（INT/DINT 计数），以背景 DB 实例形式存在"}},{id:"fmt-bit",label:"位寻址 I0.0 DBX",values:{item:"位（Bit）寻址格式",format:"I0.0、Q4.1、M10.3、DB1.DBX0.0",detail:"字节地址 . 位地址，位号 0~7；DB 中写作 DBX 并再跟位号",note:"DB1.DBX0.0 表示 DB1 第 0 字节的第 0 位；BOOL 在 DB 中按字节对齐存储"}},{id:"fmt-byte",label:"字节寻址 IB0 DBB",values:{item:"字节（BYTE）寻址格式",format:"IB0 / QB0 / MB0 / DB1.DBB0",detail:"8 位，B = BYTE，取值 0~255（十六进制 0x00~0xFF）",note:"DBB 后跟字节偏移；同一字节的 8 个位与字节值相互重叠，修改其一会影响其他位"}},{id:"fmt-word",label:"字寻址 IW0 DBW",values:{item:"字（WORD）寻址格式",format:"IW0 / QW0 / MW0 / DB1.DBW0",detail:"16 位，W = WORD，由相邻两字节组成",note:"工程习惯从偶地址开始（IW0、IW2…）：IW1 会与 IW0 共用 MB1，造成数据重叠，应避免"}},{id:"fmt-dword",label:"双字寻址 ID0 DBD",values:{item:"双字（DWORD）寻址格式",format:"ID0 / QD0 / MD0 / DB1.DBD0",detail:"32 位，D = DWORD，由相邻四字节组成；REAL 与 DINT 同样占一个双字",note:"习惯从偶地址或 4 的倍数开始；MD1 等非对齐访问应避免（S7-1500 优化访问会自动对齐）"}},{id:"fmt-db-full",label:"DB 完整绝对地址写法",values:{item:"DB 绝对地址完整写法",format:"DB1.DBX0.0 / DB1.DBB0 / DB1.DBW0 / DB1.DBD0",detail:"格式 = DB编号 . D + 宽度字母(X/B/W/D) + 字节偏移；DBX 后还需再跟位号",note:"仅标准（非优化）DB 支持；省略 DB 编号时按当前打开的 DB 解释（S7-300/400 的 OPN DB 机制）"}},{id:"byte-order",label:"字节序 大端 Motorola MW0",values:{item:"字节序（大端 / Motorola）",format:"MW0 = MB0(高 8 位) + MB1(低 8 位)",detail:"S7 采用大端序：高字节存放在低地址；MD0 = MB0 最高字节 … MB3 最低字节",note:"与 Modbus、PC（x86 小端）或第三方上位机交换 REAL / DINT 时必须做字节交换；REAL 遵循 IEEE 754 单精度大端"}},{id:"alignment",label:"字从偶地址开始 对齐习惯",values:{item:"地址对齐习惯",format:"IW0 / IW2 …、ID0 / ID4 …",detail:"字从偶地址、双字从 4 的倍数地址开始，避免跨字重叠与非对齐访问",note:"IW0 与 IW1 共用 MB1、MD0 与 MD2 共用 MB2~MB3；非对齐写入会意外覆盖相邻变量，是现场常见故障源"}},{id:"absolute-vs-symbolic",label:"绝对寻址 符号寻址",values:{item:"绝对寻址 vs 符号寻址",format:'DB1.DBW2  vs  "Motor_DB".Speed',detail:"绝对寻址依赖固定字节偏移；符号寻址通过变量名访问，由编译器管理偏移",note:"增删 DB 变量会导致绝对地址错位且编译器不报错；TIA Portal 推荐符号寻址，改结构后自动更新引用"}},{id:"optimized-access",label:"优化访问 Optimized block access",values:{item:"优化访问（S7-1200/1500 默认开启）",format:"Optimized block access = TRUE",detail:"变量按数据类型自动排序优化、不分配固定绝对偏移，只能通过符号名访问，访问速度更快且支持重构",note:"优化 DB 中 DB1.DBW0 这类绝对地址无效；与 HMI / OPC / 旧系统通信需勾选可访问或改用标准 DB"}},{id:"standard-db",label:"标准 DB 非优化访问",values:{item:"标准 DB（关闭优化访问）",format:"Standard-compatible / 非优化 DB",detail:"保留与 S7-300/400 兼容的绝对偏移布局，可用 DB1.DBW0 绝对寻址",note:"用于与旧程序、OPC DA、绝对地址 HMI 或第三方设备通信；变量排列按声明顺序并含填充字节"}},{id:"type-bool",label:"BOOL 位宽",values:{item:"BOOL",format:"1 位（DB 中占 1 字节）",detail:"布尔量，取值 TRUE / FALSE",note:"单独声明的 BOOL 在 DB 中按字节对齐存放；连续的 BOOL 位可打包到同一字节"}},{id:"type-byte-word-dword",label:"BYTE WORD DWORD 位宽",values:{item:"BYTE / WORD / DWORD",format:"8 / 16 / 32 位",detail:"无符号位串，常以 16 进制查看或做位逻辑运算",note:"WORD 与 INT 位宽相同但有符号性不同；状态字、报警字常用 WORD / DWORD 按位解析"}},{id:"type-int-dint",label:"INT DINT 位宽 范围",values:{item:"INT / DINT",format:"16 位 / 32 位有符号整数",detail:"INT：−32768~32767；DINT：−2147483648~2147483647",note:"模拟量经 NORM_X / SCALE_X 转换常落到 INT / REAL；注意大端字节序与溢出"}},{id:"type-real",label:"REAL 浮点数 IEEE 754",values:{item:"REAL",format:"32 位（占一个 DBD）",detail:"IEEE 754 单精度浮点，约 7 位有效数字",note:"大端存储；跨品牌通信需字节交换；S7-1500 另支持 LREAL（64 位双精度）"}},{id:"type-time",label:"TIME 时间类型 位宽",values:{item:"TIME / S5TIME / LTIME",format:"TIME 32 位（有符号毫秒）",detail:"IEC TIME 以 ms 为单位的 32 位有符号数，范围约 ±24.8 天",note:"S7-300/400 的 S5TIME 为带时基的 16 位 BCD 格式；S7-1500 另有 LTIME（64 位，ns）"}},{id:"type-string",label:"STRING 字符串 最大长度",values:{item:"STRING[n]",format:"占用 n + 2 字节",detail:"首字节 = 声明的最大长度，次字节 = 当前实际长度，其后为字符（ASCII）",note:"STRING[10] 占 12 字节；S7-1500 支持 WSTRING（UTF-16，占 2n + 4 字节）"}},{id:"any-pointer",label:"ANY 指针 10 字节结构",values:{item:"ANY 指针",format:"10 字节：语法头 + 类型码 + 重复因子 + DB号 + 区域指针",detail:"Byte0=0x10(语法头)、Byte1=数据类型码、Byte2~3=重复因子(数量)、Byte4~5=DB 号(非 DB 为 0)、Byte6~9=4 字节区域指针",note:"常用于 SFC20 BLKMOV、SFC14/15 等批量传送参数；可描述一片连续区域，是 S7  Indirect 寻址的核心"}},{id:"pointer-6",label:"POINTER 6 字节结构",values:{item:"POINTER 指针",format:"6 字节：DB号(2B) + 区域指针(4B)",detail:"前 2 字节为 DB 号（非 DB 区为 0），后 4 字节为带存储区码的地址指针",note:"不含类型码与重复因子，只指向一个地址；常用于 FC 的 IN/OUT 形参传递地址"}},{id:"area-pointer-4",label:"区域指针 4 字节 存储区码",values:{item:"4 字节区域指针编码",format:"0x81=I / 0x82=Q / 0x83=M / 0x84=DB / 0x85=DI / 0x86=L",detail:"最高字节为存储区码，其余 3 字节 = 字节地址 << 3 | 位地址（位号占低 3 位）",note:"例：P#I0.0 的指针值为 16#81000000，P#M10.3 为 16#83000053；解析指针时先判高字节再取地址"}},{id:"any-syntax",label:"P#DB1.DBX0.0 BYTE 10 写法",values:{item:"TIA Portal 指针常量写法",format:"P#DB1.DBX0.0 BYTE 10",detail:"P# + 区域 + DBX字节.位 + 数据类型 + 数量；表示从 DB1 第 0 字节第 0 位起连续 10 个 BYTE",note:"也可写 P#M0.0 INT 5、P#I0.0 BOOL 8；区域为 M/I/Q 时不带 DB 编号；优化 DB 不支持此类指针常量"}},{id:"s7-1500-diff",label:"S7-1500 与 S7-300/400 差异",values:{item:"S7-1500 与 S7-300/400 主要差异",format:"优化访问 / IEC 定时器计数器 / I:P / LREAL",detail:"默认优化块访问、用 IEC TON/CTU 取代 T/C 编号、外设访问用 :P 后缀、新增 LREAL / LTIME / WSTRING / 数组下标与 UDT 增强",note:"旧程序移植到 1500 需检查绝对地址与 S5TIME；具体以所用 CPU 固件版本与 TIA Portal 手册为准"}},{id:"hmi-opc",label:"与 HMI OPC 通信的寻址注意",values:{item:"HMI / OPC 访问优化 DB",format:"符号访问 或 标准 DB",detail:"优化 DB 无绝对偏移，HMI 与 OPC UA 应通过符号名访问，或在 DB 属性中启用可从 HMI/OPC 访问",note:"对第三方上位机只支持绝对地址时，需专门建标准 DB 作通信映射区，避免升级后地址错位（工程经验值）"}}],X2=!0,J2="Siemens SIMATIC S7-1200 / S7-1500 与 S7-300 / S7-400 系统手册、TIA Portal 在线帮助（寻址、数据类型、ANY / POINTER 指针格式、优化块访问）；具体寻址能力、存储区大小与保持性以所用 CPU 固件版本及手册版本为准，指针编码与外设语法在不同系列间存在差异",Y2="2026-11-05",Z2={id:K2,title:H2,domain:G2,columns:q2,rows:Q2,searchable:X2,source:J2,updatedAt:Y2},ek="automation.safetyCircuit",tk="安全回路与安全继电器速查",nk="automation",rk=[{key:"item",label:"项目",align:"left"},{key:"kind",label:"类别",align:"left"},{key:"detail",label:"要点 / 要求",align:"left"},{key:"note",label:"依据与备注",align:"left"}],lk=[{id:"stop-cat0",label:"停止类别 0 立即断电",values:{item:"停止类别 0",kind:"停止类别",detail:"立即切断执行元件电源的非受控停止，允许机械制动直接作用",note:"EN 60204-1 §9.2.2 定义；常用急停按钮直接断开接触器控制电源实现，属最直接但冲击最大的停机方式"}},{id:"stop-cat1",label:"停止类别 1 受控停止后断电",values:{item:"停止类别 1",kind:"停止类别",detail:"先保持电源使设备受控减速直至停止，达到停止状态后再切断执行元件电源",note:"EN 60204-1；现场常用带延时断电触点的安全继电器实现（如延时 0.5~10 s），延时须大于实际停机所需时间（工程经验值）"}},{id:"stop-cat2",label:"停止类别 2 受控停止保持供电",values:{item:"停止类别 2",kind:"停止类别",detail:"受控停止，但停机后执行元件仍保持供电（不断开电源）",note:"EN 60204-1；不得单独作为安全停机手段，须附加措施防止意外再启动（如使能/保持信号）"}},{id:"estop",label:"急停按钮 双通道 NC 串联",values:{item:"急停（Emergency Stop）",kind:"输入设备",detail:"双通道常闭(NC)触点串联接入安全继电器；按下强制断开，线路断线同样触发安全状态",note:"禁止使用常开(NO)单通道急停；急停器件须为自锁式、红色蘑菇头+黄色底，复位按钮须在危险区外；复位不导致自动再启动"}},{id:"safety-gate",label:"安全门 双通道 门锁监控",values:{item:"安全门 / 联锁门",kind:"输入设备",detail:"双通道安全开关 + 门锁（锁定）监控；门未关闭并锁定时禁止启动，开门即触发停止",note:"EN ISO 14119 对联锁装置与防止屏蔽（defeat）有要求；编码式/磁性编码开关抗短接能力优于普通机械开关；具体以所用产品样本为准"}},{id:"light-curtain",label:"安全光幕 OSSD 双路",values:{item:"安全光幕 / 电敏保护装置",kind:"输入设备",detail:"OSSD1 / OSSD2 双路半导体安全输出，遮蔽光束即在 ≤ 规定响应时间内关断",note:"分辨率按防护对象选：14 mm(手指) / 30 mm(手掌) / 90 mm(身体或进入探测)；安全距离按 EN ISO 13855 依响应时间和接近速度计算，不能凭经验估算"}},{id:"safety-mat",label:"安全地毯 双通道",values:{item:"安全地毯 / 压敏垫",kind:"输入设备",detail:"双通道常闭或电阻监测式，踩踏触发安全状态，需覆盖整个进入通道",note:"须与安全继电器/安全控制器配套实现断线与短路检测；定期做功能测试并检查边缘压条与线缆破损（工程经验值，以厂家样本为准）"}},{id:"two-hand",label:"双手按钮 同步 0.5 s",values:{item:"双手操纵装置",kind:"输入设备",detail:"两个按钮须在同步时间差（通常 ≤0.5 s）内同时按下才允许运行，松开任一按钮即停止",note:"EN ISO 13851；须防止单手操作、异物压住或用身体其他部位代替，按钮间距与安装位置按标准计算"}},{id:"dual-channel",label:"双通道接线 一致性监控",values:{item:"双通道输入接线",kind:"接线与诊断",detail:"两路独立输入接入安全继电器，同时监控两通道状态一致性与同步时差",note:"单通道故障不会导致安全功能丧失；两通道动作时差超时（常为数百 ms）即判故障并停机，属工程经验值，以厂家样本为准"}},{id:"short-detect",label:"断线 短路检测 测试脉冲",values:{item:"断线 / 对电源短路检测",kind:"接线与诊断",detail:"NC 回路断线即进入安全状态；对 24 V 或对 0 V 短路也应被识别为故障",note:"安全继电器通过两路不同的测试脉冲序列实现；普通 PLC 数字量输入无此诊断能力，不能替代"}},{id:"cross-short",label:"交叉短路监控",values:{item:"交叉短路（cross-short）监控",kind:"接线与诊断",detail:"两输入通道之间意外短接必须被检出并导致停机，避免冗余被旁路",note:"依赖两通道测试脉冲错相/编码；是双通道有效性成立的前提；布线时两通道电缆应分开敷设以降低共因失效（工程经验值）"}},{id:"edm",label:"EDM 反馈回路 外部设备监控",values:{item:"反馈回路 EDM（External Device Monitoring）",kind:"接线与诊断",detail:"把下游接触器 / 安全阀的常闭辅助触点串入反馈输入，复位前确认主触点未粘连",note:"又称外部设备监控；若接触器触点熔焊，安全继电器拒绝复位；应选用带强制导向(机械联锁)触点的接触器"}},{id:"reset-auto",label:"自动复位 风险",values:{item:"自动复位",kind:"复位方式",detail:"输入信号恢复后自动重新使能输出，无需人工操作",note:"风险高：人员可能仍在危险区内即自动再启动；急停与安全门回路通常禁止自动复位，须经风险评估确定"}},{id:"reset-manual",label:"手动复位 按钮位置",values:{item:"手动复位",kind:"复位方式",detail:"须由操作员按下独立复位按钮，且所有安全输入已恢复、反馈回路正常后方可复位",note:"复位按钮必须安装在危险区之外且能通视整个危险区；严禁放在危险区内或防护罩背后（常见违规）"}},{id:"reset-edge",label:"边沿触发复位 上升沿",values:{item:"边沿触发（上升沿）复位",kind:"复位方式",detail:"仅在复位信号由 0→1 的跳变瞬间生效，持续保持或短接复位信号不会反复复位",note:"防止复位按钮被卡住、被异物压住或线路短接造成事实上的自动复位；现场推荐做法（工程经验值，以厂家样本为准）"}},{id:"pl",label:"PL a~e 性能等级",values:{item:"PL a ~ PL e（性能等级）",kind:"安全等级",detail:"ISO 13849-1 中按安全功能对风险降低的贡献分级：a 最低、e 最高",note:"由类别(Category)、MTTFd、DCavg、CCF 共同确定（查标准图表）；所需 PLr 须经风险评估确定，本表仅为速查"}},{id:"sil",label:"SIL 1~3 安全完整性等级",values:{item:"SIL 1 ~ SIL 3",kind:"安全等级",detail:"IEC 62061（机械领域）与 IEC 61508 定义的安全完整性等级，机械领域通常上限为 SIL 3",note:"与 PL 大致可对应（如 PL e ≈ SIL 3）；具体 SIL 须经风险评估与 PFHd 计算确定，本表仅为速查"}},{id:"category",label:"类别 B 1 2 3 4",values:{item:"类别 B / 1 / 2 / 3 / 4",kind:"架构类别",detail:"EN ISO 13849-1 结构类别：B 基本要求、1 采用经验证元件、2 定期测试、3 单一故障不导致安全功能丧失、4 还能检测故障累积",note:"类别越高对冗余与诊断覆盖率要求越高；高风险场合通常采用双通道 Cat.3 / Cat.4 架构；具体类别须经风险评估确定"}},{id:"mttfd",label:"MTTFd 平均危险失效时间",values:{item:"MTTFd",kind:"可靠性参数",detail:"平均危险失效时间（单位：年），标准分档：3~10 年(低)、10~30 年(中)、30~100 年(高)",note:"由元件 B10d 与年操作次数 nop 换算得到；数值由厂家提供，选元件时应索取；本表分档为 EN ISO 13849-1 口径"}},{id:"dcavg",label:"DCavg 平均诊断覆盖率",values:{item:"DCavg",kind:"可靠性参数",detail:"平均诊断覆盖率，分档：<60%(无)、60~90%(低)、90~99%(中)、≥99%(高)",note:"反映故障被自动检出的比例；双通道 + 交叉短路监控 + 测试脉冲通常可达高 DC；具体以厂家提供的 DC 值为准"}},{id:"ccf",label:"CCF 共因失效 65 分",values:{item:"CCF（共因失效）",kind:"可靠性参数",detail:"EN ISO 13849-1 附录 F 的评分表，采用冗余架构时须达到 ≥65 分方可计入",note:"通过通道物理分离、不同原理/厂家多样性、过压与EMC防护、环境控制、定期维护等措施降低共因失效"}},{id:"relay-select",label:"安全继电器选型要点",values:{item:"安全继电器选型",kind:"选型",detail:"核对：输入通道数（单/双通道、可扩展）、安全输出触点数与容量（如 3NO+1NC，AC-15 230 V / 5 A）、是否需延时断电（用于停止类别 1）、可达类别 / PL / SIL、复位方式与 EDM 输入",note:"输出触点容量须与接触器线圈/电磁阀负载匹配，感性负载需加浪涌抑制；延时范围 0.1~30 s 常见。均为工程经验值，以厂家样本与风险评估结果为准"}},{id:"safety-plc-boundary",label:"安全 PLC 与常规 PLC 边界",values:{item:"安全 PLC 与常规 PLC 的职责边界",kind:"系统架构",detail:"安全逻辑必须在安全 PLC / 安全继电器 / 安全 I/O 中执行；常规 PLC 只能读取安全状态用于显示、诊断与联锁提示",note:"常规 PLC 的输出不得参与安全停机链路；F-CPU 与标准 CPU 之间通过安全通信（如 PROFIsafe）交换安全信号；具体以厂家系统手册为准"}},{id:"error-plc-input",label:"常见错误 用普通 PLC 输入代替安全回路",values:{item:"错误：用普通 PLC DI 代替安全回路",kind:"常见错误",detail:"普通数字量输入无断线、对电源短路、交叉短路诊断，触点粘连或线路短接可能掩盖危险",note:"不满足 EN ISO 13849-1 对安全相关部件的诊断要求；急停、安全门、光幕必须接入安全相关输入"}},{id:"error-reset-in-zone",label:"常见错误 复位按钮放在危险区",values:{item:"错误：复位按钮装在危险区内",kind:"常见错误",detail:"复位时操作员无法确认危险区内是否有人，可能造成意外再启动伤人",note:"复位装置须在危险区外、能通视全部危险区；同时应采用边沿触发手动复位而非自动复位"}},{id:"error-single-channel",label:"常见错误 单通道急停",values:{item:"错误：急停只接单通道",kind:"常见错误",detail:"单点断线、触点熔焊或短接即可使安全功能完全丧失，且无故障诊断",note:"单通道一般只能达到较低类别与 PL（如 Cat.1 / PL c 以下）；存在较高风险的场合必须双通道 + 交叉短路监控"}},{id:"error-parallel-output",label:"常见错误 安全输出与普通输出并联",values:{item:"错误：安全输出与普通输出并联",kind:"常见错误",detail:"普通 PLC 输出或旁路支路可能把安全触点短接，使执行元件在危险时仍得电，冗余与诊断同时被破坏",note:"安全输出必须独立且串联在执行元件供电回路中；禁止为方便调试并联临时旁路，调试跳线须纳入变更管理（工程经验值）"}}],ok=!0,ak="EN ISO 13849-1《机械安全 控制系统安全相关部件》、IEC 62061《机械安全 安全相关电气/电子/可编程电子控制系统》、IEC 61508、EN 60204-1《机械安全 机械电气设备 第1部分 通用技术条件》，并参考 EN ISO 14119（联锁装置）、EN ISO 13855（安全距离）、EN ISO 13851（双手操纵）；具体 PL / SIL / 类别与延时参数须经风险评估确定，本表仅为现场速查，接线与选型以现行标准版本和厂家样本为准",ik="2026-11-05",sk={id:ek,title:tk,domain:nk,columns:rk,rows:lk,searchable:ok,source:ak,updatedAt:ik},uk="hvac.pipeSpecs",ck="给水管材规格对照速查",dk="hvac",fk=[{key:"material",label:"管材",align:"left"},{key:"dn",label:"公称直径 DN",align:"left",mono:!0},{key:"de",label:"外径 De (mm)",align:"left",mono:!0},{key:"wall",label:"壁厚 (mm)",align:"left",mono:!0},{key:"pressure",label:"压力等级",align:"left"}],mk=[{id:"ppr-15",label:"PP-R DN15",values:{material:"PP-R",dn:"DN15",de:"20",wall:"3.4",pressure:"PN2.5（S2.5）"}},{id:"ppr-20",label:"PP-R DN20",values:{material:"PP-R",dn:"DN20",de:"25",wall:"4.2",pressure:"PN2.5（S2.5）"}},{id:"ppr-25",label:"PP-R DN25",values:{material:"PP-R",dn:"DN25",de:"32",wall:"5.4",pressure:"PN2.5（S2.5）"}},{id:"ppr-32",label:"PP-R DN32",values:{material:"PP-R",dn:"DN32",d
